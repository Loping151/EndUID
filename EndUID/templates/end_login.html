<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>终末地 · 登录</title>
  <!-- GSAP -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('gsap-anim');
      var srcs = [
        'https://lib.baomitu.com/gsap/3.13.0/gsap.min.js',
        'https://cdn.staticfile.org/gsap/3.13.0/gsap.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js'
      ];
      var done = false, i = 0, timer;
      function reveal() { if (done) return; done = true; clearTimeout(timer); d.classList.remove('gsap-anim'); }
      function ready() { if (done) return; done = true; clearTimeout(timer); window.dispatchEvent(new Event('gsapready')); }
      function next() {
        if (done) return;
        if (i >= srcs.length) { reveal(); return; }
        var s = document.createElement('script');
        s.src = srcs[i++];
        s.onload = function () { window.gsap ? ready() : next(); };
        s.onerror = next;
        document.head.appendChild(s);
        clearTimeout(timer);
        timer = setTimeout(next, 2000);
      }
      next();
      setTimeout(reveal, 8000);
    })();
  </script>
  <style>
    :root {
      --c-bg: #0f1014;
      --c-surface: rgba(20, 21, 24, 0.62);
      --c-line: rgba(255, 255, 255, 0.08);
      --c-accent: #ffe600;
      --c-text: #f3f3f3;
      --c-sub: #8b8b8b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: radial-gradient(circle at 50% -10%, #1a1b22 0%, #0f1014 70%);
      color: var(--c-text);
      font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 18px;
    }
    .bg {
      position: fixed; inset: 0; z-index: -1;
      background-size: cover; background-position: center;
      will-change: transform;
    }
    .bg::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(15,16,20,0.5), rgba(15,16,20,0.8));
    }
    .card {
      position: relative;
      --bar: 1;
      width: 100%; max-width: 340px;
      background: var(--c-surface);
      border: 1px solid var(--c-line);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding: 26px 22px 24px;
    }
    .card::before {
      content: ""; position: absolute; top: 0; left: 0;
      width: 4px; height: 100%; background: var(--c-accent);
      transform-origin: top; transform: scaleY(var(--bar));
    }
    .eyebrow {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      letter-spacing: 2px; color: var(--c-sub); text-transform: uppercase;
    }
    .eyebrow b { color: var(--c-accent); font-weight: 700; }
    h1 { font-size: 22px; font-weight: 700; margin: 6px 0 22px; }
    label { display: block; font-size: 13px; color: var(--c-sub); margin: 0 0 7px; }
    .field { margin-bottom: 16px; }
    input[type="tel"], input[type="text"] {
      width: 100%; padding: 12px 13px; border: none; border-radius: 6px;
      font-size: 16px; background: rgba(255,255,255,0.92); color: #111;
    }
    input:focus { outline: none; box-shadow: 0 0 0 2px rgba(255,230,0,0.55); }
    .code-row { display: flex; gap: 8px; }
    .code-row input { flex: 1; }
    button {
      border: none; border-radius: 6px; cursor: pointer;
      font-size: 15px; font-weight: 700; font-family: inherit;
      background: var(--c-accent); color: #0f1014;
      transition: background 0.2s, opacity 0.2s;
    }
    button:hover:not(:disabled) { background: #ffd000; }
    button:disabled { background: #4a4d55; color: #9aa0ab; cursor: not-allowed; }
    #getCodeBtn { padding: 0 14px; white-space: nowrap; }
    #loginBtn { width: 100%; padding: 13px; margin-top: 6px; }
    .uid-note {
      text-align: center; color: var(--c-accent); font-size: 12px;
      margin: 14px 0 12px; line-height: 1.5;
    }
    .tip {
      color: var(--c-sub); font-size: 11.5px; line-height: 1.6;
      margin-top: 16px; border-top: 1px solid var(--c-line); padding-top: 12px;
    }
    .expired { text-align: center; padding: 8px 0 4px; }
    .expired h2 { color: var(--c-accent); font-size: 18px; margin-bottom: 8px; }
    .expired p { color: var(--c-sub); font-size: 13px; line-height: 1.7; }

    .gsap-anim .card { visibility: hidden; }

    #ehToast {
      position: fixed; left: 50%; top: 20px;
      z-index: 3000; max-width: 86%; padding: 11px 18px;
      border-radius: 8px; font-size: 14px; font-weight: 600;
      line-height: 1.4; text-align: center;
      color: #0f1014; background: var(--c-accent);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
      opacity: 0; visibility: hidden; pointer-events: none;
    }
    #ehToast.is-error { color: #fff; background: #c0392b; }
  </style>
</head>
<body>
  {% if bg_url %}<div class="bg" style="background-image:url('{{ bg_url }}')"></div>{% endif %}
  <div class="card">
    <div class="eyebrow">// <b>ENDFIELD</b> 终末地登录</div>
    <h1>欢迎登录</h1>

    {% if expired %}
    <div class="expired">
      <h2>链接已失效</h2>
      <p>登录会话已超时或不存在，<br>请回到聊天重新发送【登录】获取新链接。</p>
    </div>
    {% else %}
    <form id="loginForm">
      <div class="field">
        <label for="phone">手机号</label>
        <input type="tel" id="phone" required pattern="[0-9]{11}" placeholder="鹰角账号绑定的11位手机号">
      </div>
      <div class="field">
        <label for="code">短信验证码</label>
        <div class="code-row">
          <input type="text" id="code" required placeholder="请输入验证码" inputmode="numeric">
          <button type="button" id="getCodeBtn" disabled>获取验证码</button>
        </div>
      </div>
      <div class="uid-note">你的账号: {{ userId }}，请勿使用别人的链接</div>
      <button type="submit" id="loginBtn" disabled>登录</button>
    </form>
    <div class="tip">⚠️ 本工具不会保存你的手机号，且不用于查询以外的其他任何用途</div>
    {% endif %}
  </div>

  <script>
    const expired = {{ 'true' if expired else 'false' }};
    if (!expired) {
      const serverUrl = "{{ server_url }}";
      const auth = "{{ auth }}";
      const phoneInput = document.getElementById('phone');
      const codeInput = document.getElementById('code');
      const getCodeBtn = document.getElementById('getCodeBtn');
      const loginBtn = document.getElementById('loginBtn');
      const loginForm = document.getElementById('loginForm');

      function isPhone(v) { return /^1\d{10}$/.test(v); }
      function refresh() {
        getCodeBtn.disabled = !isPhone(phoneInput.value);
        loginBtn.disabled = !isPhone(phoneInput.value) || codeInput.value.trim() === "";
      }
      phoneInput.addEventListener('input', refresh);
      codeInput.addEventListener('input', refresh);

      async function postJSON(path, body) {
        const r = await fetch(serverUrl + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        return r.json();
      }

      getCodeBtn.addEventListener('click', async function () {
        getCodeBtn.disabled = true;
        try {
          const res = await postJSON('/end/sendCode', { auth: auth, phone: phoneInput.value });
          alert(res.success ? '验证码已发送' : ('验证码发送失败：' + (res.msg || '')));
        } catch (e) {
          alert('请求出错，请检查网络');
        }
        let countdown = 60;
        const timer = setInterval(() => {
          getCodeBtn.textContent = countdown + '秒后重试';
          countdown--;
          if (countdown < 0) {
            clearInterval(timer);
            getCodeBtn.textContent = '获取验证码';
            refresh();
          }
        }, 1000);
      });

      loginForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        loginBtn.disabled = true;
        loginBtn.textContent = '登录中...';
        try {
          const res = await postJSON('/end/login', {
            auth: auth, phone: phoneInput.value, code: codeInput.value.trim(),
          });
          if (res.success) {
            alert('登录成功！可返回聊天查看绑定结果，本页可关闭。');
          } else {
            alert('登录失败：' + (res.msg || '请重试'));
          }
        } catch (e) {
          alert('登录失败，请重试');
        }
        loginBtn.textContent = '登录';
        refresh();
      });
    }
  </script>

  <script>
    // GSAP 动效层
    function ehInit() {
      if (!window.gsap) return;
      var card = document.querySelector('.card');
      if (!card) return;
      var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var toast = document.createElement('div');
      toast.id = 'ehToast';
      document.body.appendChild(toast);
      gsap.set(toast, { xPercent: -50 });
      var toastTl;
      function ehToast(msg) {
        var s = String(msg == null ? '' : msg);
        var isErr = /失败|出错|错误|不存在|超时|稍后|异常/.test(s);
        toast.textContent = s;
        toast.className = isErr ? 'is-error' : '';
        if (toastTl) toastTl.kill();
        gsap.killTweensOf(toast);
        toastTl = gsap.timeline()
          .fromTo(toast, { autoAlpha: 0, y: REDUCE ? 0 : -14 },
            { autoAlpha: 1, y: 0, duration: REDUCE ? 0.2 : 0.4, ease: 'back.out(1.7)' })
          .to(toast, { autoAlpha: 0, y: REDUCE ? 0 : -10, duration: 0.4, ease: 'power2.in' }, '+=2.6');
        if (isErr) shake();
      }
      window.alert = function (m) { ehToast(m); };

      var shaking = false;
      function shake() {
        if (REDUCE || shaking) return;
        shaking = true;
        gsap.to(card, {
          keyframes: [{ x: -8 }, { x: 7 }, { x: -6 }, { x: 4 }, { x: 0 }],
          duration: 0.45, ease: 'power1.inOut',
          onComplete: function () { shaking = false; }
        });
      }

      gsap.matchMedia().add({
        full: '(prefers-reduced-motion: no-preference)',
        reduce: '(prefers-reduced-motion: reduce)'
      }, function (ctx) {
        if (ctx.conditions.reduce) { gsap.set(card, { autoAlpha: 1 }); return; }
        var bg = document.querySelector('.bg');
        var bgTw = bg && gsap.fromTo(bg, { scale: 1 },
          { scale: 1.13, duration: 16, ease: 'sine.inOut', repeat: -1, yoyo: true });
        var bits = gsap.utils.toArray('.card .eyebrow, .card h1, .card .field, .card .uid-note, .card #loginBtn, .card .tip, .card .expired');
        var tl = gsap.timeline({ defaults: { ease: 'expo.out' } });
        tl.from(card, { autoAlpha: 0, y: 26, scale: 0.97, duration: 0.7 })
          .from(card, { '--bar': 0, duration: 0.55, ease: 'power2.out' }, '-=0.4')
          .from(bits, { autoAlpha: 0, y: 14, stagger: 0.07, duration: 0.5 }, '-=0.35');
        return function () { tl.kill(); if (bgTw) bgTw.kill(); };
      });
    }
    if (window.gsap) ehInit();
    else window.addEventListener('gsapready', ehInit, { once: true });
  </script>
</body>
</html>

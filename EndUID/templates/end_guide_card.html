<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Endfield Guide</title>
<style>
    @import url('{{ font_css_url }}');

    :root {
        --c-bg: #0f1014;
        --c-accent: #ffe600;
        --c-text: #ffffff;
        --c-subtext: #b6b6b6;
        --c-grid: rgba(255, 255, 255, 0.04);
        --c-card-bg: rgba(20, 21, 24, 0.85);
        --c-border: rgba(255, 230, 0, 0.18);
        --c-table-border: rgba(255, 255, 255, 0.12);
        --c-table-head: rgba(255, 230, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        width: 880px;
        background-color: var(--c-bg);
        font-family: 'Source Han Sans CN', sans-serif;
        color: var(--c-text);
        position: relative;
    }

    .container {
        position: relative;
        padding: 36px 40px 56px 40px;
    }

    .bg-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        background:
            radial-gradient(circle at 80% 0%, #1e1f24 0%, transparent 60%),
            linear-gradient(180deg, #14151a 0%, #0f1014 100%);
    }

    .grid-deco {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 320px;
        background-image:
            linear-gradient(var(--c-grid) 1px, transparent 1px),
            linear-gradient(90deg, var(--c-grid) 1px, transparent 1px);
        background-size: 60px 60px;
        z-index: 1;
        mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
    }

    .content {
        position: relative;
        z-index: 10;
    }

    .header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 16px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--c-border);
    }

    .header .title {
        font-size: 28px;
        font-weight: 700;
        color: var(--c-accent);
        letter-spacing: 1px;
    }

    .header .author {
        font-size: 14px;
        color: var(--c-subtext);
    }

    .header .author b {
        color: var(--c-text);
        font-weight: 500;
    }

    .body h2 {
        font-size: 22px;
        font-weight: 700;
        color: var(--c-accent);
        margin: 28px 0 12px 0;
        padding-left: 12px;
        border-left: 4px solid var(--c-accent);
        line-height: 1.3;
    }

    .body h3 {
        font-size: 18px;
        font-weight: 700;
        color: #ffd35a;
        margin: 20px 0 10px 0;
        line-height: 1.3;
    }

    .body p {
        font-size: 15px;
        line-height: 1.85;
        color: var(--c-text);
        margin: 0 0 10px 0;
        word-break: break-word;
    }

    .body p.empty { height: 6px; margin: 0; }

    .body b, .body strong { font-weight: 700; color: #ffe600; }
    .body i, .body em { font-style: italic; }
    .body a { color: #4fc3f7; text-decoration: none; }

    .body img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 14px auto;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .body table {
        width: 100%;
        border-collapse: collapse;
        margin: 14px 0;
        background: var(--c-card-bg);
        border-radius: 8px;
        overflow: hidden;
        font-size: 14px;
    }

    .body table th,
    .body table td {
        border: 1px solid var(--c-table-border);
        padding: 10px 12px;
        vertical-align: top;
        line-height: 1.7;
        word-break: break-word;
    }

    .body table th {
        background: var(--c-table-head);
        color: var(--c-accent);
        font-weight: 700;
        text-align: left;
    }

    .body table td p {
        font-size: 14px;
        line-height: 1.7;
        margin: 0 0 6px 0;
    }

    .body table td p:last-child { margin-bottom: 0; }

    .body table td img {
        max-width: 100%;
        margin: 6px 0;
    }

    .footer {
        margin-top: 32px;
        padding-top: 16px;
        border-top: 1px solid var(--c-border);
        font-size: 12px;
        color: var(--c-subtext);
        word-break: break-all;
    }

    .footer .label { color: var(--c-accent); margin-right: 6px; }
</style>
</head>
<body>
<div class="container">
    <div class="bg-layer"></div>
    <div class="grid-deco"></div>
    <div class="content">
        <div class="header">
            <div class="title">{{ title }}</div>
            <div class="author">攻略作者 <b>{{ author }}</b></div>
        </div>
        <div class="body">
            {{ body_html | safe }}
        </div>
        <div class="footer">
            <span class="label">来源</span>{{ source_url }}
        </div>
    </div>
</div>
</body>
</html>
